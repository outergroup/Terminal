<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Terminal</title>
<link rel="icon" href="/web/app-icon.png">
<link rel="stylesheet" href="/web/xterm.css">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="app">
  <nav class="sessions" aria-label="Terminal sessions">
    <div class="sessions-header">
      <h1>Terminal</h1>
      <button class="new-session" type="button" aria-label="New terminal" title="New terminal" aria-haspopup="menu" aria-expanded="false">+</button>
    </div>
    <ul class="session-list"></ul>
  </nav>
  <main class="terminals">
    <p class="status" role="status" aria-live="polite"></p>
    <div class="key-bar" role="toolbar" aria-label="Terminal keys">
      <button type="button" data-key="escape" aria-label="Escape">esc</button>
      <button type="button" data-key="tab" aria-label="Tab">tab</button>
      <button type="button" data-key="backtab" aria-label="Shift Tab">⇧tab</button>
      <button type="button" data-key="control" aria-label="Control" aria-pressed="false">ctrl</button>
      <span class="key-gap"></span>
      <button type="button" data-key="left" aria-label="Left arrow">←</button>
      <button type="button" data-key="up" aria-label="Up arrow">↑</button>
      <button type="button" data-key="down" aria-label="Down arrow">↓</button>
      <button type="button" data-key="right" aria-label="Right arrow">→</button>
    </div>
  </main>
</div>
<script src="/web/xterm.js"></script>
<script src="/web/addon-fit.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
